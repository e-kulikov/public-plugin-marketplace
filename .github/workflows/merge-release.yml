name: Merge checked release PR

on:
  workflow_run:
    workflows: ['Validate Plugin PR']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: marketplace-release
  cancel-in-progress: false

jobs:
  merge-release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Merge only the checked release head
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          CHECKS_TOKEN: ${{ github.token }}
        run: node scripts/release/run.mjs merge
